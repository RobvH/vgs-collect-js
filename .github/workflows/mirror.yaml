# .github/workflows/mirror.yaml
name: Mirror to Public Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  mirror:
    name: Mirror Repository
    uses: verygood-ops/cicd-shared/.github/workflows/public-mirror.yaml@public-mirror-workflow-v1.0.0
    secrets:
      VGS_GITHUB_CI_BOT_APP_ID: ${{ secrets.VGS_GITHUB_CI_BOT_APP_ID }}
      VGS_GITHUB_CI_BOT_APP_PEM_FILE: ${{ secrets.VGS_GITHUB_CI_BOT_APP_PEM_FILE }}
